<svg width="1000" height="118" viewBox="0 0 1000 118" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tech-development-title">
<title id="tech-development-title">Core Development - Application Engineering - Frontend and Backend</title>
<defs>
<linearGradient id="td-border" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
<linearGradient id="td-bg-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0a2e"/><stop offset="100%" stop-color="#0d021a"/></linearGradient>
<linearGradient id="td-bg-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
<style><![CDATA[
@media (prefers-color-scheme: dark) {
  .td-bg { fill: url(#td-bg-dark); }
