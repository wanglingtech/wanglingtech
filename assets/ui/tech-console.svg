<svg width="1200" height="290" viewBox="0 0 1200 290"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tech-console-title">

<title id="tech-console-title">Engineering Capability Matrix - Development: JavaScript TypeScript, Angular React, Node.js Express, HTML CSS - Data: PostgreSQL, MySQL SQL Server, SQL, Prisma ORM - Quality: Functional Testing, Exploratory Testing, DevTools Postman, ISO/IEC 25010 - Systems: Windows, PC Hardware, Troubleshooting, Technical Support - Online</title>

<defs>
  <linearGradient id="tc-border" x1="0" x2="1">
    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#D946EF"/>
  </linearGradient>

  <linearGradient id="tc-bg-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a0a2e"/>
    <stop offset="100%" stop-color="#0d021a"/>
  </linearGradient>

  <linearGradient id="tc-bg-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#faf5ff"/>
    <stop offset="100%" stop-color="#f3e8ff"/>
  </linearGradient>

  <linearGradient id="tc-header-dark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2d1b4e"/>
    <stop offset="100%" stop-color="#1a0a2e"/>
  </linearGradient>

  <linearGradient id="tc-header-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e9d5ff"/>
    <stop offset="100%" stop-color="#f3e8ff"/>
  </linearGradient>

  <filter id="tc-glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
  <![CDATA[
  .tc-bg { }
  .tc-title { font: 700 18px monospace; }
  .tc-label { font: 700 13px monospace; }
  .tc-text { font: 500 14px monospace; }
  .tc-status-text { font: 600 11px monospace; }

  .tc-blink { animation: tc-blink 1.8s infinite; }
  .tc-pulse { animation: tc-pulse 2s infinite; transform-origin: center; }

  @keyframes tc-blink {
    0%,45%,100% { opacity:1; }
    50%,70% { opacity:.25; }
  }

  @keyframes tc-pulse {
    0%,100% { opacity:.5; }
    50% { opacity:1; }
  }

  @media (prefers-color-scheme: dark) {
    .tc-bg { fill: url(#tc-bg-dark); }
    .tc-border { stroke: url(#tc-border); }
    .tc-header { fill: url(#tc-header-dark); }
    .tc-header-border { stroke: #3f1d5c; }
    .tc-title { fill: #f3e8ff; }
    .tc-label { fill: #c084fc; }
    .tc-text { fill: #d8b4fe; }
    .tc-accent { fill: #a855f7; }
    .tc-status { fill: #a855f7; }
    .tc-status-text { fill: #a855f7; }
    .tc-column { stroke: #3f1d5c; }
    .tc-footer-line { stroke: url(#tc-border); }
  }

  @media (prefers-color-scheme: light) {
    .tc-bg { fill: url(#tc-bg-light); }
    .tc-border { stroke: url(#tc-border); stroke-width: 2; }
    .tc-header { fill: url(#tc-header-light); }
    .tc-header-border { stroke: #d8b4fe; }
    .tc-title { fill: #4c1d95; }
    .tc-label { fill: #7e22ce; }
    .tc-text { fill: #6b21a8; }
    .tc-accent { fill: #9333ea; }
    .tc-status { fill: #9333ea; }
    .tc-status-text { fill: #9333ea; }
    .tc-column { stroke: #d8b4fe; }
    .tc-footer-line { stroke: url(#tc-border); }
  }

  @media (prefers-contrast: more) {
    .tc-title { fill: #ffffff; }
    .tc-text { fill: #e9d5ff; }
    .tc-label { fill: #d8b4fe; }
    .tc-border { stroke-width: 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  ]]>
  </style>
</defs>

<rect x="1" y="1" width="1198" height="288" rx="12"
      class="tc-bg tc-border"
      stroke-width="2"/>

<!-- header -->

<rect x="24" y="22" width="1152" height="42" rx="7"
      class="tc-header tc-header-border"
      stroke-width="1"/>

<circle cx="48" cy="43" r="5" class="tc-accent tc-pulse"/>

<text x="65" y="49" class="tc-title">
ENGINEERING // CAPABILITY MATRIX
</text>

<circle cx="1100" cy="43" r="5" class="tc-status tc-blink"/>

<text x="1114" y="48"
      class="tc-status-text">
ONLINE
</text>

<!-- columns -->

<line x1="300" y1="88" x2="300" y2="255" class="tc-column" stroke-width="1"/>
<line x1="600" y1="88" x2="600" y2="255" class="tc-column" stroke-width="1"/>
<line x1="900" y1="88" x2="900" y2="255" class="tc-column" stroke-width="1"/>

<!-- dev -->

<text x="40" y="112" class="tc-label">
01 // DEVELOPMENT
</text>

<text x="40" y="145" class="tc-text">JavaScript / TypeScript</text>
<text x="40" y="172" class="tc-text">Angular / React</text>
<text x="40" y="199" class="tc-text">Node.js / Express</text>
<text x="40" y="226" class="tc-text">HTML / CSS</text>

<!-- data -->

<text x="340" y="112" class="tc-label">
02 // DATA
</text>

<text x="340" y="145" class="tc-text">PostgreSQL</text>
<text x="340" y="172" class="tc-text">MySQL / SQL Server</text>
<text x="340" y="199" class="tc-text">SQL</text>
<text x="340" y="226" class="tc-text">Prisma ORM</text>

<!-- quality -->

<text x="640" y="112" class="tc-label">
03 // QUALITY
</text>

<text x="640" y="145" class="tc-text">Functional Testing</text>
<text x="640" y="172" class="tc-text">Exploratory Testing</text>
<text x="640" y="199" class="tc-text">DevTools / Postman</text>
<text x="640" y="226" class="tc-text">ISO/IEC 25010</text>

<!-- systems -->

<text x="940" y="112" class="tc-label">
04 // SYSTEMS
</text>

<text x="940" y="145" class="tc-text">Windows</text>
<text x="940" y="172" class="tc-text">PC Hardware</text>
<text x="940" y="199" class="tc-text">Troubleshooting</text>
<text x="940" y="226" class="tc-text">Technical Support</text>

<line x1="24" y1="268" x2="1176" y2="268"
      class="tc-footer-line"
      stroke-width="2"
      opacity=".7"/>

<circle cx="24" cy="268" r="3" class="tc-accent"/>
<circle cx="1176" cy="268" r="3" class="tc-accent"/>

</svg>