<svg width="1200" height="170" viewBox="0 0 1200 170"
xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="digital-network-title">

<title id="digital-network-title">Digital Ecosystem - Software Development and Digital Solutions - Primary: Wangling Tech - Secondary: Wangling Gaming</title>

<defs>
<linearGradient id="dn-border" x1="0" x2="1">
<stop stop-color="#A855F7"/>
<stop offset=".5" stop-color="#7C3AED"/>
<stop offset="1" stop-color="#D946EF"/>
</linearGradient>

<linearGradient id="dn-bg-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0a2e"/>
<stop offset="100%" stop-color="#0d021a"/>
</linearGradient>

<linearGradient id="dn-bg-light" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#faf5ff"/>
<stop offset="100%" stop-color="#f3e8ff"/>
</linearGradient>

<style>
<![CDATA[
@media (prefers-color-scheme: dark) {
  .dn-bg { fill: url(#dn-bg-dark); }
  .dn-border { stroke: url(#dn-border); }
  .dn-title { fill: #f3e8ff; }
  .dn-subtitle { fill: #a855f7; }
  .dn-detail { fill: #c084fc; }
  .dn-status { fill: #a855f7; }
}
@media (prefers-color-scheme: light) {
  .dn-bg { fill: url(#dn-bg-light); }
  .dn-border { stroke: url(#dn-border); stroke-width: 2; }
  .dn-title { fill: #4c1d95; }
  .dn-subtitle { fill: #9333ea; }
  .dn-detail { fill: #7e22ce; }
  .dn-status { fill: #9333ea; }
}
@media (prefers-contrast: more) {
  .dn-title { fill: #ffffff; }
  .dn-subtitle { fill: #e9d5ff; }
  .dn-detail { fill: #d8b4fe; }
  .dn-border { stroke-width: 3; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
]]>
</style>
</defs>

<rect x="1" y="1" width="1198" height="168" rx="12"
class="dn-bg dn-border" stroke-width="2"/>

<circle cx="40" cy="35" r="5" class="dn-status">
  <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
</circle>

<text x="60" y="40" class="dn-detail" font-family="monospace" font-size="11" font-weight="500">DIGITAL ECOSYSTEM</text>

<text x="600" y="78" text-anchor="middle" class="dn-title" font-family="monospace" font-size="22" font-weight="700">
SOFTWARE DEVELOPMENT &amp; DIGITAL SOLUTIONS
</text>

<text x="600" y="111" text-anchor="middle" class="dn-subtitle" font-family="monospace" font-size="13" font-weight="600">
PRIMARY: WANGLING TECH
</text>

<text x="600" y="140" text-anchor="middle" class="dn-detail" font-family="monospace" font-size="11" font-weight="500">
SECONDARY: WANGLING GAMING
</text>

</svg>