<stop offset="100%" stop-color="#f3e8ff"/>
</linearGradient>

<style>
<![CDATA[
@media (prefers-color-scheme: dark) {
  .web-card-01-bg { fill: url(#web-card-01-bg-dark); }
  .web-card-01-label { fill: #c084fc; }
  .web-card-01-title { fill: #f3e8ff; }
  .web-card-01-desc { fill: #d8b4fe; }
