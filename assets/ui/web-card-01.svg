</linearGradient>

<linearGradient id="web-card-01-bg-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0a2e"/>
<stop offset="100%" stop-color="#0d021a"/>
</linearGradient>

<linearGradient id="web-card-01-bg-light" x1="0" y1="0" x2="1" y2="1">
