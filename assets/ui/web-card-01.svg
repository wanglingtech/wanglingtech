  .web-card-01-desc { fill: #6b21a8; }
  .web-card-01-tags { fill: #9333ea; }
  .web-card-01-border { stroke: url(#web-card-01-border); stroke-width: 2; }
  .web-card-01-status { fill: #9333ea; }
}

@media (prefers-contrast: more) {
  .web-card-01-title { fill: #ffffff; }
  .web-card-01-desc { fill: #e9d5ff; }
  .web-card-01-tags { fill: #d8b4fe; }
  .web-card-01-border { stroke-width: 3; }
