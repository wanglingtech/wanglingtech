<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
<title id="er-title">Engineering Radar with relative focus percentages</title>
<desc id="er-desc">Radar left, bars right. Relative focus derived from the previous radar geometry, not a proficiency assessment. Software Development: 88%; Databases: 83%; Software Quality: 74%; IT Systems: 83%; Cybersecurity: 80%; IoT: 83%.</desc>
<defs>
  <linearGradient id="er-border" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
  <linearGradient id="er-bar" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset="0.6" stop-color="#A855F7"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
  <linearGradient id="er-bg-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0a2e"/><stop offset="100%" stop-color="#0d021a"/></linearGradient>
  <linearGradient id="er-bg-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
  <style><![CDATA[
  .title{font:700 23px monospace}
  .meta{font:700 15px monospace}
  .axis{font:700 18px monospace}
  .label{font:500 20px monospace}
  .value{font:700 20px monospace}
  .note{font:500 16px monospace}

  .er-shape { }
  @media (prefers-reduced-motion: no-preference){
    .er-anim { animation: er-breathe 5s ease-in-out infinite }
  }
  @keyframes er-breathe { 0%,100%{fill-opacity:.45} 50%{fill-opacity:.65} }

  @media (prefers-color-scheme: dark) {
    .er-bg { fill: url(#er-bg-dark); }
    .er-border { stroke: url(#er-border); }
    .er-title { fill: #f3e8ff; }
    .er-meta { fill: #c084fc; }
    .er-axis { fill: #a855f7; }
    .er-label { fill: #d8b4fe; }
    .er-value { fill: #a855f7; }
    .er-note { fill: #a855f7; }
    .er-grid { stroke: #3f1d5c; }
    .er-divider { stroke: #3f1d5c; }
    .er-shape { fill: #7C3AED; stroke: #A855F7; }
    .er-vertex { fill: #a855f7; }
    .er-bar-bg { fill: #2d1b4e; }
    .er-bar-fill { fill: url(#er-bar); }
  }

  @media (prefers-color-scheme: light) {
    .er-bg { fill: url(#er-bg-light); }
    .er-border { stroke: url(#er-border); stroke-width: 2; }
    .er-title { fill: #4c1d95; }
    .er-meta { fill: #7e22ce; }
    .er-axis { fill: #9333ea; }
    .er-label { fill: #6b21a8; }
    .er-value { fill: #9333ea; }
    .er-note { fill: #7e22ce; }
    .er-grid { stroke: #d8b4fe; }
    .er-divider { stroke: #d8b4fe; }
    .er-shape { fill: #9333ea; stroke: #7c3aed; }
    .er-vertex { fill: #9333ea; }
    .er-bar-bg { fill: #e9d5ff; }
    .er-bar-fill { fill: url(#er-bar); }
  }

  @media (prefers-contrast: more) {
    .er-title { fill: #ffffff; }
    .er-label { fill: #e9d5ff; }
    .er-value { fill: #e9d5ff; }
    .er-border { stroke-width: 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  ]]></style>
</defs>
<rect x="1" y="1" width="488" height="518" rx="14" class="er-bg er-border" stroke-width="2"/>
<rect x="511" y="1" width="488" height="518" rx="14" class="er-bg er-border" stroke-width="2"/>
