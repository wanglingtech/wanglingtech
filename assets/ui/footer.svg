<svg width="1200" height="180" viewBox="0 0 1200 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="background">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#2E1065" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="footerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- background glow -->

  <rect
    width="1200"
    height="180"
    fill="url(#background)"
  />

  <!-- upper line -->

  <rect
    x="80"
    y="15"
    width="1040"
    height="2"
    fill="url(#border)"
  />

  <!-- animated energy -->

  <rect
    x="-200"
    y="13"
    width="180"
    height="5"
    rx="3"
    fill="#C084FC"
    filter="url(#footerGlow)">

    <animate
      attributeName="x"
      from="-200"
      to="1200"
      dur="5s"
      repeatCount="indefinite"
    />

  </rect>

  <!-- cyberpunk corners -->

  <path
    d="M80 35 L80 60 M80 35 L105 35"
    stroke="#7C3AED"
    stroke-width="2"
  />

  <path
    d="M1120 35 L1120 60 M1120 35 L1095 35"
    stroke="#7C3AED"
    stroke-width="2"
  />

  <path
    d="M80 145 L80 120 M80 145 L105 145"
    stroke="#7C3AED"
    stroke-width="2"
  />

  <path
    d="M1120 145 L1120 120 M1120 145 L1095 145"
    stroke="#7C3AED"
    stroke-width="2"
  />

  <!-- center decoration -->

  <circle
    cx="600"
    cy="90"
    r="5"
    fill="#A855F7"
    filter="url(#footerGlow)">

    <animate
      attributeName="opacity"
      values="0.35;1;0.35"
      dur="2s"
      repeatCount="indefinite"
    />

  </circle>

  <line
    x1="460"
    y1="90"
    x2="575"
    y2="90"
    stroke="#7C3AED"
    stroke-width="1"
  />

  <line
    x1="625"
    y1="90"
    x2="740"
    y2="90"
    stroke="#7C3AED"
    stroke-width="1"
  />

  <!-- lower line -->

  <rect
    x="80"
    y="163"
    width="1040"
    height="2"
    fill="url(#border)"
  />

</svg>