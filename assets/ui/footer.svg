<svg width="1200" height="190" viewBox="0 0 1200 190"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <line x1="80"
        y1="30"
        x2="1120"
        y2="30"
        stroke="url(#line)"
        stroke-width="2"/>

  <text
    x="600"
    y="90"
    text-anchor="middle"
    fill="#E6EDF3"
    font-family="monospace"
    font-size="23"
    font-weight="bold">
    WANGLING // TECH
  </text>

  <text
    x="600"
    y="123"
    text-anchor="middle"
    fill="#A855F7"
    font-family="monospace"
    font-size="14">
    BUILD // LEARN // ITERATE
  </text>

  <circle
    cx="600"
    cy="154"
    r="5"
    fill="#3FB950"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values=".25;1;.25"
      dur="1.6s"
      repeatCount="indefinite"
    />

  </circle>

  <text
    x="620"
    y="159"
    fill="#8B949E"
    font-family="monospace"
    font-size="12">
    SYSTEM ONLINE
  </text>

  <rect
    x="-200"
    y="28"
    width="180"
    height="4"
    fill="#E9D5FF"
    filter="url(#glow)">

    <animate
      attributeName="x"
      values="-200;1200"
      dur="5s"
      repeatCount="indefinite"
    />

  </rect>

</svg>