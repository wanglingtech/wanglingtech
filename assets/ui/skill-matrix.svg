<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-matrix-title">
<title id="skill-matrix-title">Skill Matrix - Capability Analytics: Radar chart showing Frontend 88%, Backend 80%, Databases 85%, QA Testing 75%, IT Systems 92%, DevOps Tools 65%. Bar chart with same proficiency levels.</title>
<defs>
<linearGradient id="sm-border" x1="0" x2="1">
<stop offset="0%" stop-color="#7C3AED"/>
<stop offset="50%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#D946EF"/>
</linearGradient>
<linearGradient id="sm-bg-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0a2e"/>
<stop offset="100%" stop-color="#0d021a"/>
</linearGradient>
<linearGradient id="sm-bg-light" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#faf5ff"/>
<stop offset="100%" stop-color="#f3e8ff"/>
</linearGradient>
<linearGradient id="sm-panel-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#2d1b4e"/>
<stop offset="100%" stop-color="#1a0a2e"/>
</linearGradient>
<linearGradient id="sm-panel-light" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#e9d5ff"/>
<stop offset="100%" stop-color="#f3e8ff"/>
</linearGradient>
<linearGradient id="sm-radar-fill-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
<stop offset="100%" stop-color="#d946ef" stop-opacity="0.25"/>
</linearGradient>
<linearGradient id="sm-radar-fill-light" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#9333ea" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
</linearGradient>
<linearGradient id="sm-bar" x1="0" x2="1">
<stop offset="0%" stop-color="#7C3AED"/>
<stop offset="100%" stop-color="#D946EF"/>
</linearGradient>
<filter id="sm-glow">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
<![CDATA[
@media (prefers-color-scheme: dark) {
  .sm-bg { fill: url(#sm-bg-dark); }
  .sm-border { stroke: #3f1d5c; }
  .sm-top-line { fill: url(#sm-border); }
  .sm-header { fill: #c084fc; }
  .sm-panel { fill: url(#sm-panel-dark); }
  .sm-panel-border { stroke: #3f1d5c; }
  .sm-section-title { fill: #a855f7; }
  .sm-grid-ring { stroke: #3f1d5c; }
  .sm-grid-ring-inner { stroke: #2d1b4e; }
  .sm-axis { stroke: #2d1b4e; }
  .sm-radar-fill { fill: url(#sm-radar-fill-dark); stroke: url(#sm-border); }
  .sm-vertex { fill: #a855f7; }
  .sm-label-accent { fill: #c084fc; }
  .sm-label { fill: #a855f7; }
  .sm-bar-bg { fill: #2d1b4e; }
  .sm-bar-fill { fill: url(#sm-bar); }
  .sm-bar-label { fill: #f3e8ff; }
  .sm-bar-value { fill: #a855f7; }
}
@media (prefers-color-scheme: light) {
  .sm-bg { fill: url(#sm-bg-light); }
  .sm-border { stroke: #d8b4fe; stroke-width: 2; }
  .sm-top-line { fill: url(#sm-border); }
  .sm-header { fill: #7e22ce; }
  .sm-panel { fill: url(#sm-panel-light); }
  .sm-panel-border { stroke: #d8b4fe; }
  .sm-section-title { fill: #9333ea; }
  .sm-grid-ring { stroke: #d8b4fe; }
  .sm-grid-ring-inner { stroke: #e9d5ff; }
  .sm-axis { stroke: #e9d5ff; }
  .sm-radar-fill { fill: url(#sm-radar-fill-light); stroke: url(#sm-border); }
  .sm-vertex { fill: #9333ea; }
  .sm-label-accent { fill: #7e22ce; }
  .sm-label { fill: #9333ea; }
  .sm-bar-bg { fill: #e9d5ff; }
  .sm-bar-fill { fill: url(#sm-bar); }
  .sm-bar-label { fill: #4c1d95; }
  .sm-bar-value { fill: #9333ea; }
}
@media (prefers-contrast: more) {
  .sm-header { fill: #ffffff; }
  .sm-bar-label { fill: #ffffff; }
  .sm-bar-value { fill: #e9d5ff; }
  .sm-label-accent { fill: #e9d5ff; }
  .sm-border { stroke-width: 3; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
]]>
</style>
</defs>

<!-- FRAME -->
<rect x="1" y="1" width="1198" height="438" rx="14" class="sm-bg sm-border"/>
<rect x="1" y="1" width="1198" height="4" rx="2" class="sm-top-line"/>

<text x="35" y="42" class="sm-header"
      font-family="monospace" font-size="14" font-weight="bold">
  SKILL.MATRIX // CAPABILITY ANALYTICS
</text>

<!-- ============ LEFT: RADAR ============ -->
<rect x="25" y="65" width="565" height="350" rx="10" class="sm-panel sm-panel-border"/>
<text x="55" y="92" class="sm-section-title" font-family="monospace" font-size="12">
  RADAR // CORE CAPABILITIES
</text>

<!-- Grid rings -->
<polygon points="330,100 451.2,170 451.2,310 330,380 208.8,310 208.8,170"
         fill="none" class="sm-grid-ring" stroke-width="1"/>
<polygon points="330,135 420.9,187.5 420.9,292.5 330,345 239.1,292.5 239.1,187.5"
         fill="none" class="sm-grid-ring-inner" stroke-width="1"/>
<polygon points="330,170 390.6,205 390.6,275 330,310 269.4,275 269.4,205"
         fill="none" class="sm-grid-ring-inner" stroke-width="1"/>
<polygon points="330,205 360.3,222.5 360.3,257.5 330,275 299.7,257.5 299.7,222.5"
         fill="none" class="sm-grid-ring-inner" stroke-width="1"/>

<!-- Axes -->
<g class="sm-axis" stroke-width="1">
  <line x1="330" y1="240" x2="330" y2="100"/>
  <line x1="330" y1="240" x2="451.2" y2="170"/>
  <line x1="330" y1="240" x2="451.2" y2="310"/>
  <line x1="330" y1="240" x2="330" y2="380"/>
  <line x1="330" y1="240" x2="208.8" y2="310"/>
  <line x1="330" y1="240" x2="208.8" y2="170"/>
</g>

<!-- DATA POLYGON (v: 0.88 / 0.80 / 0.85 / 0.75 / 0.92 / 0.65) -->
<polygon points="330,116.8 427,184 433.1,299.5 330,345 218.5,304.4 251.2,194.5"
         class="sm-radar-fill"
         stroke-width="2"
         filter="url(#sm-glow)">
  <animate attributeName="opacity" values="0;1;1" dur="2s" fill="freeze"/>
</polygon>

<!-- Vertex dots -->
<g class="sm-vertex" filter="url(#sm-glow)">
  <circle cx="330" cy="116.8" r="4"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="427" cy="184" r="4"/>
  <circle cx="433.1" cy="299.5" r="4"/>
  <circle cx="330" cy="345" r="4"/>
  <circle cx="218.5" cy="304.4" r="4"/>
  <circle cx="251.2" cy="194.5" r="4"/>
</g>

<!-- Labels -->
<g font-family="monospace" font-size="11" letter-spacing="1">
  <text x="330" y="88" text-anchor="middle" class="sm-label-accent">FRONTEND</text>
  <text x="470" y="170" class="sm-label">BACKEND</text>
  <text x="470" y="316" class="sm-label">DATABASES</text>
  <text x="330" y="402" text-anchor="middle" class="sm-label">QA / TESTING</text>
  <text x="190" y="316" text-anchor="end" class="sm-label">IT / SYSTEMS</text>
  <text x="190" y="170" text-anchor="end" class="sm-label">DEVOPS / TOOLS</text>
</g>

<!-- ============ RIGHT: BARS ============ -->
<rect x="610" y="65" width="565" height="350" rx="10" class="sm-panel sm-panel-border"/>
<text x="640" y="92" class="sm-section-title" font-family="monospace" font-size="12">
  BARS // PROFICIENCY INDEX
</text>

<!-- ROW 1: FRONTEND 88 -->
<text x="640" y="135" class="sm-bar-label" font-family="monospace" font-size="12" letter-spacing="1">FRONTEND</text>
<rect x="870" y="125" width="250" height="12" rx="3" class="sm-bar-bg"/>
<rect x="870" y="125" width="0" height="12" rx="3" class="sm-bar-fill" filter="url(#sm-glow)">
  <animate attributeName="width" values="0;220" dur="1.8s" fill="freeze"/>
</rect>
<text x="1130" y="135" class="sm-bar-value" font-family="monospace" font-size="12">88%</text>

<!-- ROW 2: BACKEND 80 -->
<text x="640" y="180" class="sm-bar-label" font-family="monospace" font-size="12" letter-spacing="1">BACKEND</text>
<rect x="870" y="170" width="250" height="12" rx="3" class="sm-bar-bg"/>
<rect x="870" y="170" width="0" height="12" rx="3" class="sm-bar-fill" filter="url(#sm-glow)">
  <animate attributeName="width" values="0;200" dur="1.8s" fill="freeze"/>
</rect>
<text x="1130" y="180" class="sm-bar-value" font-family="monospace" font-size="12">80%</text>

<!-- ROW 3: DATABASES 85 -->
<text x="640" y="225" class="sm-bar-label" font-family="monospace" font-size="12" letter-spacing="1">DATABASES / SQL</text>
<rect x="870" y="215" width="250" height="12" rx="3" class="sm-bar-bg"/>
<rect x="870" y="215" width="0" height="12" rx="3" class="sm-bar-fill" filter="url(#sm-glow)">
  <animate attributeName="width" values="0;212.5" dur="1.8s" fill="freeze"/>
</rect>
<text x="1130" y="225" class="sm-bar-value" font-family="monospace" font-size="12">85%</text>

<!-- ROW 4: QA 75 -->
<text x="640" y="270" class="sm-bar-label" font-family="monospace" font-size="12" letter-spacing="1">QA / TESTING</text>
<rect x="870" y="260" width="250" height="12" rx="3" class="sm-bar-bg"/>
<rect x="870" y="260" width="0" height="12" rx="3" class="sm-bar-fill" filter="url(#sm-glow)">
  <animate attributeName="width" values="0;187.5" dur="1.8s" fill="freeze"/>
</rect>
<text x="1130" y="270" class="sm-bar-value" font-family="monospace" font-size="12">75%</text>

<!-- ROW 5: IT 92 -->
<text x="640" y="315" class="sm-bar-label" font-family="monospace" font-size="12" letter-spacing="1">IT SYSTEMS</text>
<rect x="870" y="305" width="250" height="12" rx="3" class="sm-bar-bg"/>
<rect x="870" y="305" width="0" height="12" rx="3" class="sm-bar-fill" filter="url(#sm-glow)">
  <animate attributeName="width" values="0;230" dur="1.8s" fill="freeze"/>
</rect>
<text x="1130" y="315" class="sm-bar-value" font-family="monospace" font-size="12">92%</text>

<!-- ROW 6: DEVOPS 65 -->
<text x="640" y="360" class="sm-bar-label" font-family="monospace" font-size="12" letter-spacing="1">DEVOPS / TOOLS</text>
<rect x="870" y="350" width="250" height="12" rx="3" class="sm-bar-bg"/>
<rect x="870" y="350" width="0" height="12" rx="3" class="sm-bar-fill" filter="url(#sm-glow)">
  <animate attributeName="width" values="0;162.5" dur="1.8s" fill="freeze"/>
</rect>
<text x="1130" y="360" class="sm-bar-value" font-family="monospace" font-size="12">65%</text>

</svg>