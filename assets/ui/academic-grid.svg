}
@media (prefers-contrast: more) {
  .ag-title { fill: #ffffff; }
  .ag-body { fill: #e9d5ff; }
  .ag-accent { fill: #d8b4fe; }
  .ag-border { stroke-width: 3; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
]]></style>
