<svg width="1200" height="150" viewBox="0 0 1200 150"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="purple">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cyan">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect
    x="1"
    y="1"
    width="1198"
    height="148"
    rx="12"
    fill="#0D1117"
    stroke="#30363D"
  />

  <!-- CARD 01 -->

  <text x="55" y="43"
        fill="#8B949E"
        font-family="monospace"
        font-size="13">
    PRIMARY SYSTEM
  </text>

  <text x="55" y="75"
        fill="#E6EDF3"
        font-family="monospace"
        font-size="18"
        font-weight="bold">
    SOFTWARE DEVELOPMENT
  </text>

  <rect x="55" y="96"
        width="220"
        height="3"
        fill="url(#purple)">

  </rect>

  <!-- separator -->

  <line x1="400" y1="30" x2="400" y2="120"
        stroke="#30363D"/>

  <!-- CARD 02 -->

  <text x="450" y="43"
        fill="#8B949E"
        font-family="monospace"
        font-size="13">
    ENGINEERING FOCUS
  </text>

  <text x="450" y="75"
        fill="#E6EDF3"
        font-family="monospace"
        font-size="17"
        font-weight="bold">
    DATA // QUALITY // SYSTEMS
  </text>

  <rect x="450" y="96"
        width="210"
        height="3"
        fill="url(#cyan)">

  </rect>

  <!-- separator -->

  <line x1="795" y1="30" x2="795" y2="120"
        stroke="#30363D"/>

  <!-- CARD 03 -->

  <text x="845" y="43"
        fill="#8B949E"
        font-family="monospace"
        font-size="13">
    CURRENT LEVEL
  </text>

  <text x="845" y="75"
        fill="#E6EDF3"
        font-family="monospace"
        font-size="18"
        font-weight="bold">
    VIII SEMESTER
  </text>

  <circle cx="852" cy="99" r="5"
          fill="#3FB950"
          filter="url(#glow)">

  </circle>

  <text x="870" y="104"
        fill="#3FB950"
        font-family="monospace"
        font-size="13">
    ACTIVE
  </text>

</svg>
