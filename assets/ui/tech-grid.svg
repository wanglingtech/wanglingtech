<svg width="1200" height="390" viewBox="0 0 1200 390"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop stop-color="#A855F7"/>
    <stop offset=".55" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .num{font:700 11px monospace;fill:#22D3EE}
    .title{font:700 17px monospace;fill:#E6EDF3}
    .sub{font:500 12px monospace;fill:#8B949E}
    .status{font:600 10px monospace;fill:#3FB950}
  </style>
</defs>

<rect width="1200" height="390" rx="14" fill="#0D1117"/>

<!-- CARD 1 -->
<rect x="20" y="20" width="570" height="165" rx="10"
fill="#0D1117" stroke="#7C3AED"/>

<rect x="38" y="38" width="534" height="38" rx="6" fill="#161B22"/>

<text x="55" y="62" class="num">01</text>
<text x="95" y="62" class="title">CORE // DEVELOPMENT</text>

<circle cx="540" cy="57" r="4" fill="#3FB950"/>
<text x="470" y="112" class="sub">APPLICATION ENGINEERING</text>
<text x="55" y="112" class="sub">FRONTEND + BACKEND</text>
<text x="55" y="143" class="sub">JS · TS · ANGULAR · REACT · NODE</text>

<!-- CARD 2 -->
<rect x="610" y="20" width="570" height="165" rx="10"
fill="#0D1117" stroke="#A855F7"/>

<rect x="628" y="38" width="534" height="38" rx="6" fill="#161B22"/>

<text x="645" y="62" class="num">02</text>
<text x="685" y="62" class="title">DATA // PERSISTENCE</text>

<circle cx="1130" cy="57" r="4" fill="#3FB950"/>

<text x="645" y="112" class="sub">RELATIONAL DATA SYSTEMS</text>
<text x="645" y="143" class="sub">POSTGRESQL · MYSQL · SQL SERVER · PRISMA</text>

<!-- CARD 3 -->
<rect x="20" y="205" width="570" height="165" rx="10"
fill="#0D1117" stroke="#A855F7"/>

<rect x="38" y="223" width="534" height="38" rx="6" fill="#161B22"/>

<text x="55" y="247" class="num">03</text>
<text x="95" y="247" class="title">ENGINEERING // TOOLCHAIN</text>

<circle cx="540" cy="242" r="4" fill="#3FB950"/>

<text x="55" y="297" class="sub">DEVELOPMENT WORKFLOW</text>
<text x="55" y="328" class="sub">GIT · GITHUB · VS CODE · POSTMAN</text>

<!-- CARD 4 -->
<rect x="610" y="205" width="570" height="165" rx="10"
fill="#0D1117" stroke="#22D3EE"/>

<rect x="628" y="223" width="534" height="38" rx="6" fill="#161B22"/>

<text x="645" y="247" class="num">04</text>
<text x="685" y="247" class="title">DEPLOYMENT // PLATFORM</text>

<circle cx="1130" cy="242" r="4" fill="#3FB950"/>

<text x="645" y="297" class="sub">WEB DELIVERY</text>
<text x="645" y="328" class="sub">VERCEL · CLOUDFLARE</text>

<line x1="20" y1="383" x2="1180" y2="383"
stroke="url(#g)" stroke-width="2"/>

</svg>