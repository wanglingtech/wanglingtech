<text x="55" y="297" class="tg-sub" font-family="monospace" font-size="12" font-weight="500">DEVELOPMENT WORKFLOW</text>
<text x="55" y="328" class="tg-sub" font-family="monospace" font-size="12" font-weight="500">GIT · GITHUB · VS CODE · POSTMAN</text>

