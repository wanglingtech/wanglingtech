<svg width="1200" height="390" viewBox="0 0 1200 390"
xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tech-grid-title">

<title id="tech-grid-title">Technology grid - Core Development: Application Engineering, Frontend and Backend, JS TS Angular React Node - Data Persistence: Relational Data Systems, PostgreSQL MySQL SQL Server Prisma ORM - Engineering Toolchain: Git GitHub VS Code Postman - Deployment Platform: Web Delivery, Vercel Cloudflare</title>

<defs>
  <linearGradient id="tg-border" x1="0" x2="1">
    <stop stop-color="#A855F7"/>
    <stop offset=".5" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#D946EF"/>
  </linearGradient>

  <linearGradient id="tg-bg-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a0a2e"/>
    <stop offset="100%" stop-color="#0d021a"/>
  </linearGradient>

  <linearGradient id="tg-bg-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#faf5ff"/>
    <stop offset="100%" stop-color="#f3e8ff"/>
  </linearGradient>

  <linearGradient id="tg-card-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2d1b4e"/>
    <stop offset="100%" stop-color="#1a0a2e"/>
  </linearGradient>

  <linearGradient id="tg-card-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e9d5ff"/>
    <stop offset="100%" stop-color="#f3e8ff"/>
  </linearGradient>

  <filter id="tg-glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
  <![CDATA[
  .tg-frame-border { stroke: url(#tg-border); }
  .tg-badge-border { stroke: url(#tg-border); }

  @media (prefers-color-scheme: dark) {
    .tg-frame { fill: url(#tg-bg-dark); }
    .tg-card { fill: url(#tg-card-dark); }
    .tg-card-border { stroke: #3f1d5c; }
    .tg-header { fill: #2d1b4e; }
    .tg-num { fill: #c084fc; }
    .tg-title { fill: #f3e8ff; }
    .tg-sub { fill: #a855f7; }
    .tg-status { fill: #a855f7; }
    .tg-footer-line { stroke: url(#tg-border); }
  }

  @media (prefers-color-scheme: light) {
    .tg-frame { fill: url(#tg-bg-light); }
    .tg-card { fill: url(#tg-card-light); }
    .tg-card-border { stroke: #d8b4fe; }
    .tg-header { fill: #e9d5ff; }
    .tg-num { fill: #7e22ce; }
    .tg-title { fill: #4c1d95; }
    .tg-sub { fill: #9333ea; }
    .tg-status { fill: #9333ea; }
    .tg-footer-line { stroke: url(#tg-border); }
  }

  @media (prefers-contrast: more) {
    .tg-title { fill: #ffffff; }
    .tg-sub { fill: #e9d5ff; }
    .tg-frame-border { stroke-width: 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  ]]>
  </style>
</defs>

<rect width="1200" height="390" rx="14" class="tg-frame"/>

<!-- CARD 1 -->
<rect x="20" y="20" width="570" height="165" rx="10"
class="tg-card tg-card-border" stroke-width="1"/>

<rect x="38" y="38" width="534" height="38" rx="6" class="tg-header"/>

