<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sg" x1="0" x2="1">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="50%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="ss" x1="0" x2="1">
    <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
    <stop offset="50%" stop-color="#F5D0FE"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <filter id="sglow">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="1" y="1" width="1198" height="58" rx="10" fill="#0D1117" stroke="#30363D"/>
<rect x="1" y="1" width="1198" height="3" rx="1.5" fill="url(#sg)"/>

<!-- NUMBER BADGE -->
<rect x="18" y="16" width="58" height="28" rx="6"
      fill="#161B22" stroke="url(#sg)" stroke-width="1.2"/>
<text x="47" y="35" text-anchor="middle"
      fill="#A855F7" font-family="monospace" font-size="13" font-weight="bold">06</text>

<!-- TITLE -->
<text x="92" y="36"
      fill="#E6EDF3" font-family="monospace" font-size="16"
      font-weight="bold" letter-spacing="6">ACADEMIC NETWORK</text>

<!-- BLINKING CURSOR -->
<rect x="330" y="20" width="3" height="20" fill="#22D3EE" filter="url(#sglow)">
  <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
</rect>

<!-- RIGHT STATUS -->
<circle cx="1130" cy="30" r="4" fill="#3FB950" filter="url(#sglow)">
  <animate attributeName="opacity" values=".3;1;.3" dur="1.7s" repeatCount="indefinite"/>
</circle>
<text x="1142" y="35" fill="#3FB950"
      font-family="monospace" font-size="11">ONLINE</text>

<!-- SCAN LINE -->
<rect x="-200" y="28" width="160" height="2" fill="url(#ss)" filter="url(#sglow)">
  <animate attributeName="x" values="-200;1200" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>