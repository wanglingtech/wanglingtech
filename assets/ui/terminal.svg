<svg width="1200" height="230" viewBox="0 0 1200 230"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terminal-title">

<title id="terminal-title">Engineering Profile Terminal - Initializing engineering profile, profile loaded, projects experience contact, system status ready, building systems learning iterating</title>

<defs>

<linearGradient id="terminal-border" x1="0" x2="1">
<stop offset="0%" stop-color="#7C3AED"/>
<stop offset="50%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#D946EF"/>
</linearGradient>

<linearGradient id="terminal-bg-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0a2e"/>
<stop offset="100%" stop-color="#0d021a"/>
</linearGradient>

<linearGradient id="terminal-bg-light" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#faf5ff"/>
<stop offset="100%" stop-color="#f3e8ff"/>
</linearGradient>

<radialGradient id="terminal-glow-dark">
<stop offset="0%" stop-color="#7c3aed" stop-opacity=".15"/>
<stop offset="100%" stop-color="#0d021a" stop-opacity="0"/>
</radialGradient>

<radialGradient id="terminal-glow-light">
<stop offset="0%" stop-color="#a855f7" stop-opacity=".10"/>
<stop offset="100%" stop-color="#f3e8ff" stop-opacity="0"/>
</radialGradient>

<filter id="terminal-glow">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<style>
<![CDATA[
@media (prefers-color-scheme: dark) {
  .terminal-bg { fill: url(#terminal-bg-dark); }
  .terminal-glow-bg { fill: url(#terminal-glow-dark); }
  .terminal-border { stroke: #3f1d5c; }
  .terminal-top-bar { fill: url(#terminal-border); }
  .terminal-prompt { fill: #c084fc; }
  .terminal-command { fill: #a855f7; }
  .terminal-output { fill: #f3e8ff; }
  .terminal-separator { fill: #d8b4fe; }
  .terminal-dim { fill: #a855f7; }
  .terminal-status { fill: #a855f7; }
  .terminal-status-text { fill: #a855f7; }
  .terminal-footer { fill: #d8b4fe; }
  .terminal-dot { fill: #a855f7; }
  .terminal-window-controls { fill: #a855f7; }
}

@media (prefers-color-scheme: light) {
  .terminal-bg { fill: url(#terminal-bg-light); }
  .terminal-glow-bg { fill: url(#terminal-glow-light); }
  .terminal-border { stroke: #d8b4fe; stroke-width: 2; }
  .terminal-top-bar { fill: url(#terminal-border); }
  .terminal-prompt { fill: #7e22ce; }
  .terminal-command { fill: #9333ea; }
  .terminal-output { fill: #4c1d95; }
  .terminal-separator { fill: #a855f7; }
  .terminal-dim { fill: #9333ea; }
  .terminal-status { fill: #9333ea; }
  .terminal-status-text { fill: #9333ea; }
  .terminal-footer { fill: #6b21a8; }
  .terminal-dot { fill: #9333ea; }
  .terminal-window-controls { fill: #9333ea; }
}

@media (prefers-contrast: more) {
  .terminal-output { fill: #ffffff; }
  .terminal-command { fill: #e9d5ff; }
  .terminal-prompt { fill: #d8b4fe; }
  .terminal-border { stroke-width: 3; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
]]>
</style>
</defs>

<rect
  x="2"
  y="2"
  width="1196"
  height="226"
  rx="14"
  class="terminal-bg terminal-border"
/>

<rect
  x="2"
  y="2"
  width="1196"
  height="226"
  rx="14"
  class="terminal-glow-bg"
/>

<rect
  x="2"
  y="2"
  width="1196"
  height="4"
  rx="2"
  class="terminal-top-bar"
/>

<circle cx="30" cy="27" r="5" class="terminal-window-controls"/>
<circle cx="49" cy="27" r="5" class="terminal-window-controls"/>
<circle cx="68" cy="27" r="5" class="terminal-window-controls"/>

<text
  x="92"
  y="32"
  class="terminal-prompt"
  font-family="monospace"
  font-size="15">

  wanglingtech@github:~$
</text>

<text
  x="40"
  y="78"
  class="terminal-command"
  font-family="monospace"
  font-size="17"
  font-weight="bold">

  > INITIALIZING ENGINEERING PROFILE...
</text>

<text
  x="40"
  y="112"
  class="terminal-output"
  font-family="monospace"
  font-size="16">

  PROFILE LOADED
</text>

<text
  x="290"
  y="112"
  class="terminal-separator"
  font-family="monospace"
  font-size="16">
  ·
</text>

<text
  x="330"
  y="112"
  class="terminal-output"
  font-family="monospace"
  font-size="16">
  PROJECTS
</text>

<text
  x="465"
  y="112"
  class="terminal-separator"
  font-family="monospace"
  font-size="16">
  ·
</text>

<text
  x="505"
  y="112"
  class="terminal-output"
  font-family="monospace"
  font-size="16">EXPERIENCE</text>

<text
  x="625"
  y="112"
  class="terminal-separator"
  font-family="monospace"
  font-size="16">
  ·
</text>

<text
  x="665"
  y="112"
  class="terminal-output"
  font-family="monospace"
  font-size="16">
  CONTACT
</text>

<text
  x="40"
  y="151"
  class="terminal-dim"
  font-family="monospace"
  font-size="15">
  SYSTEM STATUS
</text>

<circle
  cx="185"
  cy="146"
  r="6"
  class="terminal-status"
  filter="url(#terminal-glow)">
  <animate
    attributeName="opacity"
    values=".3;1;.3"
    dur="1.7s"
    repeatCount="indefinite"
  />
</circle>

<text
  x="202"
  y="151"
  class="terminal-status-text"
  font-family="monospace"
  font-size="15"
  font-weight="bold">
  READY
</text>

<text
  x="40"
  y="190"
  class="terminal-footer"
  font-family="monospace"
  font-size="15">
  BUILDING SYSTEMS
</text>

<text
  x="225"
  y="190"
  class="terminal-dot"
  font-family="monospace"
  font-size="15">
  ●
  <animate
    attributeName="opacity"
    values="1;.2;1"
    dur="1s"
    repeatCount="indefinite"
  />
</text>

<text
  x="250"
  y="190"
  class="terminal-footer"
  font-family="monospace"
  font-size="15">
  LEARNING
</text>

<text
  x="355"
  y="190"
  class="terminal-dot"
  font-family="monospace"
  font-size="15">
  ●
  <animate
    attributeName="opacity"
    values=".2;1;.2"
    dur="1.3s"
    repeatCount="indefinite"
  />
</text>

<text
  x="380"
  y="190"
  class="terminal-footer"
  font-family="monospace"
  font-size="15">
  ITERATING
</text>

</svg>