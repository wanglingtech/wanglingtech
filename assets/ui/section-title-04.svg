<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="section-title-04-title">
<title id="section-title-04-title">Section 04: Featured Systems</title>
<defs>
<linearGradient id="st04-border" x1="0" x2="1">
<stop offset="0%" stop-color="#7C3AED"/>
<stop offset="50%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#D946EF"/>
</linearGradient>
<linearGradient id="st04-bg-dark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0a2e"/>
<stop offset="100%" stop-color="#0d021a"/>
</linearGradient>
<linearGradient id="st04-bg-light" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#faf5ff"/>
<stop offset="100%" stop-color="#f3e8ff"/>
</linearGradient>
<linearGradient id="st04-scan-dark" x1="0" x2="1">
<stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
<stop offset="50%" stop-color="#c084fc" stop-opacity="0.6"/>
<stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
</linearGradient>
<linearGradient id="st04-scan-light" x1="0" x2="1">
<stop offset="0%" stop-color="#9333ea" stop-opacity="0"/>
<stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
</linearGradient>
<filter id="st04-glow">
<feGaussianBlur stdDeviation="2.4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
<![CDATA[
@media (prefers-color-scheme: dark) {
  .st04-bg { fill: url(#st04-bg-dark); }
  .st04-border { stroke: #3f1d5c; }
  .st04-top-line { fill: url(#st04-border); }
  .st04-badge-bg { fill: #2d1b4e; }
  .st04-badge-border { stroke: url(#st04-border); }
  .st04-badge-text { fill: #c084fc; }
  .st04-title { fill: #f3e8ff; }
  .st04-cursor { fill: #a855f7; }
  .st04-status-dot { fill: #a855f7; }
  .st04-status-text { fill: #a855f7; }
  .st04-scan { fill: url(#st04-scan-dark); }
}
@media (prefers-color-scheme: light) {
  .st04-bg { fill: url(#st04-bg-light); }
  .st04-border { stroke: #d8b4fe; stroke-width: 2; }
  .st04-top-line { fill: url(#st04-border); }
  .st04-badge-bg { fill: #e9d5ff; }
  .st04-badge-border { stroke: url(#st04-border); }
  .st04-badge-text { fill: #7e22ce; }
  .st04-title { fill: #4c1d95; }
  .st04-cursor { fill: #9333ea; }
  .st04-status-dot { fill: #9333ea; }
  .st04-status-text { fill: #9333ea; }
  .st04-scan { fill: url(#st04-scan-light); }
}
@media (prefers-contrast: more) {
  .st04-title { fill: #ffffff; }
  .st04-badge-text { fill: #e9d5ff; }
  .st04-border { stroke-width: 3; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
]]>
</style>
</defs>

<rect x="1" y="1" width="1198" height="58" rx="10" class="st04-bg st04-border"/>
<rect x="1" y="1" width="1198" height="3" rx="1.5" class="st04-top-line"/>

<!-- NUMBER BADGE -->
<rect x="18" y="16" width="58" height="28" rx="6"
      class="st04-badge-bg st04-badge-border" stroke-width="1.2"/>
<text x="47" y="35" text-anchor="middle"
      class="st04-badge-text" font-family="monospace" font-size="13" font-weight="bold">04</text>

<!-- TITLE -->
<text x="92" y="36"
      class="st04-title" font-family="monospace" font-size="16"
      font-weight="bold" letter-spacing="3">FEATURED SYSTEMS</text>

<!-- BLINKING CURSOR -->
<rect x="311" y="20" width="3" height="20" class="st04-cursor" filter="url(#st04-glow)">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- RIGHT STATUS -->
<circle cx="1130" cy="30" r="4" class="st04-status-dot" filter="url(#st04-glow)">
  <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
</circle>
<text x="1142" y="35" class="st04-status-text"
      font-family="monospace" font-size="11">READY</text>

<!-- SCAN LINE -->
<rect x="-200" y="28" width="160" height="2" class="st04-scan" filter="url(#st04-glow)">
  <animate attributeName="x" values="-200;1200" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>