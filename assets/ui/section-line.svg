<svg width="1200" height="26" viewBox="0 0 1200 26"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="15%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line
    x1="35"
    y1="13"
    x2="1165"
    y2="13"
    stroke="url(#base)"
    stroke-width="1.5"
  />

  <circle cx="35" cy="13" r="2.7" fill="#A855F7"/>
  <circle cx="1165" cy="13" r="2.7" fill="#A855F7"/>

  <rect
    x="-200"
    y="11"
    width="190"
    height="4"
    rx="2"
    fill="url(#pulse)"
    filter="url(#glow)">

    <animate
      attributeName="x"
      values="-200;1200"
      dur="4.5s"
      repeatCount="indefinite"
    />

  </rect>

</svg>